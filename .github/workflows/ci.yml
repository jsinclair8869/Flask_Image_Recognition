name: CI

# Run on every push and on pull requests targeting main.
on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub runner.
      - name: Checkout code
        uses: actions/checkout@v6

      # Use the Python version recommended for the assignment.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Install application dependencies and the code-quality tool.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint

      # Uses your .pylintrc, including the minimum score of 9.
      - name: Run Pylint
        run: python -m pylint app.py model.py

      # Discover and run all tests, including test_assignment2.py.
      - name: Run pytest
        run: python -m pytest -v
